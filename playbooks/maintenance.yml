---
- name: Manutencao ou auditoria de servidores cPanel
  hosts: all
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    audit_only: false
    managed_services:
      - cpanel.service
      - httpd.service
      - lshttpd.service
      - mariadb.service
      - mysql.service
      - exim.service
      - dovecot.service
      - imunify360.service
  pre_tasks:
    - name: Descobrir Python compativel sem depender do Python remoto
      ansible.builtin.raw: |
        for p in /usr/bin/python3.12 /usr/bin/python3.11 /usr/bin/python3.10 /usr/bin/python3.9 /usr/bin/python3.8 /usr/bin/python3.7 /usr/libexec/platform-python /usr/bin/python3; do
          if [ -x "$p" ] && "$p" -c 'import sys; sys.exit(0 if (3,7) <= sys.version_info[:2] <= (3,12) else 1)' >/dev/null 2>&1; then
            echo "$p"
            exit 0
          fi
        done
        exit 42
      register: python_probe
      changed_when: false
      failed_when: false

    - name: Bloquear servidor sem Python suportado pelo Ansible 2.17
      ansible.builtin.assert:
        that:
          - python_probe.rc == 0
          - (python_probe.stdout_lines | default([]) | length) > 0
        fail_msg: >-
          Nenhum Python remoto compatível com Ansible 2.17 (3.7 a 3.12).
          Em AlmaLinux 8, instale python3.11 em janela apropriada usando
          dnf install python3.11; não substitua /usr/bin/python3 nem platform-python.

    - name: Selecionar Python remoto encontrado
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ python_probe.stdout_lines | map('trim') | reject('equalto', '') | first }}"

    - name: Coletar fatos usando Python selecionado
      ansible.builtin.setup:

  tasks:
    - name: Validar plataforma e instalacao cPanel
      block:
        - ansible.builtin.assert:
            that:
              - ansible_facts['os_family'] == 'RedHat'
            fail_msg: "Requer AlmaLinux/CloudLinux (familia RedHat)."
        - ansible.builtin.stat:
            path: /usr/local/cpanel/scripts/upcp
          register: upcp_script
        - ansible.builtin.assert:
            that: upcp_script.stat.exists
            fail_msg: "cPanel ausente. Operacao interrompida."

    - name: Registrar estado inicial dos servicos
      ansible.builtin.service_facts:
      register: initial_services

    - name: Identificar CloudLinux sem alterar o sistema
      ansible.builtin.command: rpm -q cloudlinux-release
      register: cloudlinux_release
      changed_when: false
      failed_when: cloudlinux_release.rc not in [0, 1]

    - name: Identificar Imunify360 instalado
      ansible.builtin.command: rpm -q imunify360-agent
      register: imunify_package
      changed_when: false
      failed_when: imunify_package.rc not in [0, 1]

    - name: Inicializar estado da manutencao
      ansible.builtin.set_fact:
        maintenance_status: "{{ 'AUDITORIA' if audit_only | bool else 'SUCESSO' }}"
        maintenance_error: ""
        dnf_changed: false
        cpanel_executed: false
        imunify_executed: false

    - name: Atualizacoes protegidas
      block:
        - name: Atualizar DNF no EL8 pelo executavel do sistema
          ansible.builtin.command:
            argv:
              - /usr/bin/dnf
              - upgrade
              - -y
          register: dnf_el8_result
          changed_when: true
          when:
            - not audit_only | bool
            - ansible_facts['distribution_major_version'] == '8'

        - name: Atualizar pacotes DNF em EL9 ou superior
          ansible.builtin.dnf:
            name: '*'
            state: latest
            update_cache: true
          register: dnf_result
          when:
            - not audit_only | bool
            - ansible_facts['distribution_major_version'] != '8'

        - name: Registrar resultado DNF
          ansible.builtin.set_fact:
            dnf_changed: "{{ (dnf_el8_result.changed | default(false)) if ansible_facts['distribution_major_version'] == '8' else (dnf_result.changed | default(false)) }}"
          when: not audit_only | bool

        - name: Atualizar cPanel (canal configurado no proprio servidor)
          ansible.builtin.command: /usr/local/cpanel/scripts/upcp
          register: upcp_result
          changed_when: true
          when: not audit_only | bool

        - name: Registrar execucao do cPanel
          ansible.builtin.set_fact:
            cpanel_executed: true
          when: not audit_only | bool

        - name: Atualizar regras ModSecurity do Imunify360 instalado
          ansible.builtin.command: imunify360-agent update --force modsec-rules
          changed_when: true
          register: imunify_result
          when:
            - not audit_only | bool
            - imunify_package.rc == 0

        - name: Registrar execucao Imunify360
          ansible.builtin.set_fact:
            imunify_executed: true
          when:
            - not audit_only | bool
            - imunify_package.rc == 0

        - name: Limpar cache DNF
          ansible.builtin.command: dnf clean all
          changed_when: true
          when: not audit_only | bool
      rescue:
        - name: Registrar erro e bloquear etapas restantes de atualizacao
          ansible.builtin.set_fact:
            maintenance_status: FALHA
            maintenance_error: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default('consulte saida Ansible') }}"
      always:
        - name: Atualizar fatos dos servicos apos manutencao
          ansible.builtin.service_facts:
          register: final_services

        - name: Identificar verificacao de reboot disponivel
          ansible.builtin.command: dnf needs-restarting --help
          register: reboot_support
          changed_when: false
          failed_when: false

        - name: Consultar necessidade de reboot
          ansible.builtin.command: dnf needs-restarting -r
          register: reboot_result
          changed_when: false
          failed_when: false
          when: reboot_support.rc == 0

        - name: Ler kernel em uso
          ansible.builtin.command: uname -r
          register: kernel_running
          changed_when: false
          failed_when: false

        - name: Ler kernel padrao de boot
          ansible.builtin.command: grubby --default-kernel
          register: kernel_boot
          changed_when: false
          failed_when: false

        - name: Identificar servicos que deixaram de executar
          ansible.builtin.set_fact:
            failed_services: "{{ (failed_services | default([])) + [item] }}"
          loop: "{{ managed_services }}"
          when:
            - (initial_services.ansible_facts.services.get(item, {}).get('state', 'absent')) == 'running'
            - (final_services.ansible_facts.services.get(item, {}).get('state', 'absent')) != 'running'

        - name: Marcar falha em servicos anteriormente ativos
          ansible.builtin.set_fact:
            maintenance_status: FALHA
            maintenance_error: "{{ maintenance_error }} Servicos deixaram de executar: {{ failed_services | join(', ') }}"
          when: (failed_services | default([])) | length > 0

        - name: Criar diretorio local de relatorios
          ansible.builtin.file:
            path: "{{ playbook_dir }}/../reports"
            state: directory
            mode: '0700'
          delegate_to: localhost
          become: false

        - name: Salvar relatorio JSON somente na maquina local
          ansible.builtin.copy:
            dest: "{{ playbook_dir }}/../reports/{{ inventory_hostname | regex_replace('[^a-zA-Z0-9_.-]', '_') }}-{{ ansible_date_time.iso8601_basic }}.json"
            mode: '0600'
            content: "{{ report_payload | to_nice_json }}\n"
          vars:
            report_payload:
              host: "{{ inventory_hostname }}"
              python_interpreter: "{{ ansible_python_interpreter }}"
              dnf_method: "{{ 'system-cli' if ansible_facts['distribution_major_version'] == '8' else 'ansible.builtin.dnf' }}"
              started_at_utc: "{{ ansible_date_time.iso8601 }}"
              mode: "{{ 'audit' if audit_only | bool else 'maintenance' }}"
              status: "{{ maintenance_status }}"
              failure: "{{ maintenance_error }}"
              cloudlinux: "{{ cloudlinux_release.stdout | default('nao identificado') }}"
              imunify360: "{{ imunify_package.stdout | default('nao instalado') }}"
              cpanel_executed: "{{ cpanel_executed }}"
              dnf_changed: "{{ dnf_changed }}"
              imunify_rules_updated: "{{ imunify_executed }}"
              running_kernel: "{{ kernel_running.stdout | default('indisponivel') }}"
              boot_kernel: "{{ kernel_boot.stdout | default('indisponivel') }}"
              reboot_check_rc: "{{ reboot_result.rc | default('nao executado') }}"
              reboot_check_note: "0 = nao indicado; 1 = indicado; outros = inconclusivo"
              failed_services: "{{ failed_services | default([]) }}"
              services_before: "{{ initial_services.ansible_facts.services | default({}) | dict2items | selectattr('key', 'in', managed_services) | items2dict }}"
              services_after: "{{ final_services.ansible_facts.services | default({}) | dict2items | selectattr('key', 'in', managed_services) | items2dict }}"
          delegate_to: localhost
          become: false

        - name: Mostrar resultado e reboot
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }} | Estado: {{ maintenance_status }}"
              - "CloudLinux: {{ cloudlinux_release.stdout | default('nao identificado') }}"
              - "Reboot DNF: {{ 'SIM' if (reboot_result.rc | default(2)) == 1 else ('NAO' if (reboot_result.rc | default(2)) == 0 else 'INCONCLUSIVO') }}"
              - "Kernel atual: {{ kernel_running.stdout | default('indisponivel') }}"
              - "Kernel boot: {{ kernel_boot.stdout | default('indisponivel') }}"
              - "Relatorio local: reports/"

    - name: Encerrar com falha quando houve erro de atualizacao
      ansible.builtin.fail:
        msg: "{{ maintenance_error }}"
      when: maintenance_status == 'FALHA'
